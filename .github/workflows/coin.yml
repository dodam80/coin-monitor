name: coin-bot

on:
  schedule:
    - cron: "*/15 * * * *"    # 15분마다: 매수·매도 참고 신호 + 대시보드 갱신
  workflow_dispatch:          # 수동 실행 (텔레그램 테스트 가능)
    inputs:
      test_alert:
        description: "텔레그램 연결 테스트 메시지 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coin-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests pandas matplotlib

      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ github.event.inputs.test_alert }}
        run: |
          if [ "$TEST_ALERT" = "true" ]; then
            python coin_bot.py --test-alert
            exit 0
          fi
          python coin_bot.py --mode signal

      - name: Save results
        run: |
          git config user.name "coin-bot"
          git config user.email "coin-bot@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "update coin results"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
